  snapshot-deployment:
    if: github.repository == 'square/leakcanary' && 'push' == 'push'
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: 'zulu'
    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c   # v5
    - name: Deploy snapshot
      run: ./gradlew publish
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
    - name: Cleanup secrets
      if: always()
      run: rm -rf ~/.gradle/gradle.properties
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
